<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Project by Camila</title>
  <style>
    :root{
      --bg:#f6f4f1;
      --card:#ffffff;
      --text:#161616;
      --muted:#6f6f6f;
      --line:#e8e3dc;
      --accent:#111111;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .wrap{
      max-width:980px;
      margin:0 auto;
      padding:24px 16px 48px;
    }
    h1{
      text-align:center;
      margin:8px 0 24px;
      font-size:34px;
      font-weight:700;
      letter-spacing:-0.02em;
    }
    .topbar{
      display:grid;
      grid-template-columns:repeat(6,1fr);
      gap:10px;
      margin-bottom:18px;
    }
    .tab-btn{
      border:1px solid var(--line);
      background:#fff;
      padding:12px 10px;
      border-radius:14px;
      font-weight:600;
      cursor:pointer;
    }
    .tab-btn:hover{border-color:#cfc8bf}
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:22px;
      padding:18px;
      margin-bottom:18px;
      box-shadow:0 1px 2px rgba(0,0,0,.03);
    }
    .card h2{
      margin:0 0 14px;
      font-size:24px;
    }
    .sub{
      margin:18px 0 10px;
      font-size:13px;
      text-transform:uppercase;
      letter-spacing:.12em;
      color:var(--muted);
      font-weight:700;
    }
    .exercise{
      border:1px solid var(--line);
      border-radius:16px;
      padding:12px;
      margin-bottom:10px;
      background:#fff;
    }
    .row1{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }
    .row1 label{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:600;
      flex:1;
      min-width:220px;
    }
    .video{
      text-decoration:none;
      color:#fff;
      background:var(--accent);
      padding:7px 12px;
      border-radius:999px;
      font-size:13px;
      font-weight:600;
    }
    .video:hover{opacity:.9}
    .row2{
      display:grid;
      grid-template-columns:1fr;
      gap:8px;
      margin-top:10px;
    }
    input[type="text"], input[type="date"], textarea, select{
      width:100%;
      border:1px solid var(--line);
      border-radius:12px;
      padding:11px 12px;
      font:inherit;
      background:#fff;
    }
    textarea{
      min-height:80px;
      resize:vertical;
    }
    .hidden{display:none}
    .calendar{
      display:grid;
      grid-template-columns:repeat(7,1fr);
      gap:10px;
      margin-top:10px;
    }
    .day{
      border:1px solid var(--line);
      border-radius:16px;
      background:#fff;
      padding:12px;
      min-height:110px;
    }
    .dayname{
      font-size:13px;
      color:var(--muted);
      margin-bottom:8px;
      font-weight:700;
    }
    .small{
      font-size:12px;
      color:var(--muted);
      margin-top:6px;
    }
    .save-btn{
      border:none;
      background:var(--accent);
      color:#fff;
      padding:12px 14px;
      border-radius:14px;
      font-weight:700;
      cursor:pointer;
    }
    .save-btn:hover{opacity:.92}
    .log-list{
      margin-top:14px;
      display:grid;
      gap:10px;
    }
    .log-item{
      border:1px solid var(--line);
      border-radius:16px;
      background:#fff;
      padding:12px;
    }
    @media (max-width:900px){
      .topbar{grid-template-columns:repeat(2,1fr)}
      .calendar{grid-template-columns:repeat(2,1fr)}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Project by Camila</h1>

    <div class="topbar">
      <button class="tab-btn" onclick="showWorkout('lower1')">Lower 1</button>
      <button class="tab-btn" onclick="showWorkout('upper1')">Upper 1</button>
      <button class="tab-btn" onclick="showWorkout('lower2')">Lower 2</button>
      <button class="tab-btn" onclick="showWorkout('upper2')">Upper 2</button>
      <button class="tab-btn" onclick="showWorkout('lower3')">Lower 3</button>
      <button class="tab-btn" onclick="showWorkout('upper3')">Upper 3</button>
    </div>

    <div class="card">
      <h2>Weekly log</h2>
      <div style="display:grid;grid-template-columns:180px 1fr 180px;gap:10px;">
        <input type="date" id="logDate">
        <select id="logWorkout">
          <option value="">Select workout</option>
          <option>Lower 1</option>
          <option>Upper 1</option>
          <option>Lower 2</option>
          <option>Upper 2</option>
          <option>Lower 3</option>
          <option>Upper 3</option>
          <option>Rest day</option>
          <option>Missed</option>
        </select>
        <button class="save-btn" onclick="addLog()">Add day</button>
      </div>
      <div class="small">Use this to note what you actually did on each date.</div>
      <div id="logList" class="log-list"></div>
    </div>

    <div id="lower1" class="card workout-section">
      <h2>Lower 1 🍑</h2>

      <div class="sub">Mobility</div>
      <div id="l1-mobility"></div>

      <div class="sub">Training</div>
      <div id="l1-training"></div>
    </div>

    <div id="upper1" class="card workout-section hidden">
      <h2>Upper 1 🧠</h2>

      <div class="sub">Postural</div>
      <div id="u1-postural"></div>

      <div class="sub">Mobility</div>
      <div id="u1-mobility"></div>

      <div class="sub">Training</div>
      <div id="u1-training"></div>
    </div>

    <div id="lower2" class="card workout-section hidden">
      <h2>Lower 2 🍑</h2>

      <div class="sub">Mobility</div>
      <div id="l2-mobility"></div>

      <div class="sub">Training</div>
      <div id="l2-training"></div>
    </div>

    <div id="upper2" class="card workout-section hidden">
      <h2>Upper 2 🧠</h2>

      <div class="sub">Postural</div>
      <div id="u2-postural"></div>

      <div class="sub">Mobility</div>
      <div id="u2-mobility"></div>

      <div class="sub">Training</div>
      <div id="u2-training"></div>
    </div>

    <div id="lower3" class="card workout-section hidden">
      <h2>Lower 3 🍑</h2>

      <div class="sub">Mobility</div>
      <div id="l3-mobility"></div>

      <div class="sub">Training</div>
      <div id="l3-training"></div>
    </div>

    <div id="upper3" class="card workout-section hidden">
      <h2>Upper 3 🧠</h2>

      <div class="sub">Postural</div>
      <div id="u3-postural"></div>

      <div class="sub">Mobility</div>
      <div id="u3-mobility"></div>

      <div class="sub">Training</div>
      <div id="u3-training"></div>
    </div>
  </div>

  <script>
    function showWorkout(id){
      document.querySelectorAll('.workout-section').forEach(el => el.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function exerciseHTML(name, video){
      return `
        <div class="exercise">
          <div class="row1">
            <label>
              <input type="checkbox">
              <span>${name}</span>
            </label>
            <a class="video" href="${video}" target="_blank">Video</a>
          </div>
          <div class="row2">
            <input type="text" placeholder="kg / sets / reps">
            <input type="text" placeholder="Notes">
          </div>
        </div>
      `;
    }

    const data = {
      "l1-mobility": [
        ["Hamstring stretch","https://www.youtube.com/results?search_query=hamstring+stretch"],
        ["90/90 hip mobility","https://www.youtube.com/results?search_query=90%2F90+hip+mobility"],
        ["Banded lateral walk","https://www.youtube.com/results?search_query=banded+lateral+walk"]
      ],
      "l1-training": [
        ["Hip Thrust","https://www.youtube.com/results?search_query=hip+thrust+proper+form"],
        ["Romanian Deadlift","https://www.youtube.com/results?search_query=romanian+deadlift+proper+form"],
        ["Bulgarian Split Squat","https://www.youtube.com/results?search_query=bulgarian+split+squat+proper+form"],
        ["Cable Kickback","https://www.youtube.com/results?search_query=cable+kickback+proper+form"],
        ["Hip Abduction","https://www.youtube.com/results?search_query=hip+abduction+machine+proper+form"]
      ],

      "u1-postural": [
        ["Wall Slides","https://www.youtube.com/results?search_query=wall+slides+exercise"],
        ["Glute Bridge Hold","https://www.youtube.com/results?search_query=glute+bridge+hold"],
        ["Dead Bug","https://www.youtube.com/results?search_query=dead+bug+exercise"]
      ],
      "u1-mobility": [
        ["Thoracic rotation","https://www.youtube.com/results?search_query=thoracic+rotation+mobility"],
        ["Chest opener","https://www.youtube.com/results?search_query=chest+opener+stretch"]
      ],
      "u1-training": [
        ["Face Pull","https://www.youtube.com/results?search_query=face+pull+proper+form"],
        ["Lateral Raise","https://www.youtube.com/results?search_query=lateral+raise+proper+form"],
        ["Arnold Press","https://www.youtube.com/results?search_query=arnold+press+proper+form"],
        ["Seated Row","https://www.youtube.com/results?search_query=seated+row+proper+form"]
      ],

      "l2-mobility": [
        ["Hip flexor stretch","https://www.youtube.com/results?search_query=hip+flexor+stretch"],
        ["Hamstring stretch","https://www.youtube.com/results?search_query=hamstring+stretch"],
        ["Ankle mobility","https://www.youtube.com/results?search_query=ankle+mobility"]
      ],
      "l2-training": [
        ["Sumo Squat","https://www.youtube.com/results?search_query=sumo+squat+proper+form"],
        ["Leg Press","https://www.youtube.com/results?search_query=leg+press+proper+form"],
        ["Step-Up","https://www.youtube.com/results?search_query=step+up+proper+form"],
        ["Hip Thrust (light)","https://www.youtube.com/results?search_query=hip+thrust+proper+form"],
        ["Abduction","https://www.youtube.com/results?search_query=hip+abduction+machine+proper+form"]
      ],

      "u2-postural": [
        ["Face Pull light","https://www.youtube.com/results?search_query=face+pull+proper+form"],
        ["Kickback light","https://www.youtube.com/results?search_query=glute+kickback+exercise"],
        ["Plank","https://www.youtube.com/results?search_query=plank+proper+form"]
      ],
      "u2-mobility": [
        ["Chest opener","https://www.youtube.com/results?search_query=chest+opener+stretch"],
        ["Thoracic mobility","https://www.youtube.com/results?search_query=thoracic+mobility"],
        ["Neck mobility","https://www.youtube.com/results?search_query=neck+mobility+exercise"]
      ],
      "u2-training": [
        ["Lat Pulldown","https://www.youtube.com/results?search_query=lat+pulldown+proper+form"],
        ["Seated Row","https://www.youtube.com/results?search_query=seated+row+proper+form"],
        ["Chest Press","https://www.youtube.com/results?search_query=chest+press+proper+form"],
        ["Lateral Raise","https://www.youtube.com/results?search_query=lateral+raise+proper+form"]
      ],

      "l3-mobility": [
        ["Hip opener","https://www.youtube.com/results?search_query=hip+opener+mobility"],
        ["Hamstring stretch","https://www.youtube.com/results?search_query=hamstring+stretch"]
      ],
      "l3-training": [
        ["Single Leg Hip Thrust","https://www.youtube.com/results?search_query=single+leg+hip+thrust+proper+form"],
        ["Glute Bridge","https://www.youtube.com/results?search_query=glute+bridge+proper+form"],
        ["Cable Kickback","https://www.youtube.com/results?search_query=cable+kickback+proper+form"],
        ["Frog Pumps","https://www.youtube.com/results?search_query=frog+pumps+exercise"],
        ["Fire Hydrant","https://www.youtube.com/results?search_query=fire+hydrant+exercise"]
      ],

      "u3-postural": [
        ["Y-T Raises","https://www.youtube.com/results?search_query=y+t+raises+exercise"],
        ["Bridge March","https://www.youtube.com/results?search_query=bridge+march+exercise"],
        ["Brace Hold","https://www.youtube.com/results?search_query=brace+hold+core"]
      ],
      "u3-mobility": [
        ["Thoracic extension","https://www.youtube.com/results?search_query=thoracic+extension+mobility"],
        ["Shoulder mobility","https://www.youtube.com/results?search_query=shoulder+mobility+exercise"]
      ],
      "u3-training": [
        ["Lateral Raise","https://www.youtube.com/results?search_query=lateral+raise+proper+form"],
        ["Front Raise","https://www.youtube.com/results?search_query=front+raise+proper+form"],
        ["Reverse Fly","https://www.youtube.com/results?search_query=reverse+fly+proper+form"],
        ["Face Pull","https://www.youtube.com/results?search_query=face+pull+proper+form"]
      ]
    };

    Object.keys(data).forEach(id => {
      const container = document.getElementById(id);
      container.innerHTML = data[id].map(item => exerciseHTML(item[0], item[1])).join('');
    });

    function addLog(){
      const date = document.getElementById('logDate').value;
      const workout = document.getElementById('logWorkout').value;
      if(!date || !workout) return;

      const list = document.getElementById('logList');
      const div = document.createElement('div');
      div.className = 'log-item';
      div.innerHTML = `<strong>${date}</strong><div class="small">${workout}</div>`;
      list.prepend(div);

      document.getElementById('logDate').value = '';
      document.getElementById('logWorkout').value = '';
    }
  </script>
</body>
</html>
