<script>
function toggle(id){
  let el = document.getElementById(id);

}
</script>

<!-- TEMPLATE FUNCTION -->
<script>
function exercise(name, link){
  return `
  <div class="exercise">
    <input type="checkbox"> ${name}
    <a href="${link}" target="_blank">▶️</a><br>
    kg:<input type="text">
    sets:<input type="text">
    reps:<input type="text"><br>
    notes:<input style="width:200px">
  </div>
  `;
}
</script>
